name: Build APK

# Setiap ada perubahan di branch main, GitHub membuat file APK baru
# dan menaruhnya di halaman Releases untuk di-download ke HP.
# Pull request juga dibangun (untuk memastikan tidak ada yang rusak),
# tetapi hanya main yang diterbitkan ke Releases.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Siapkan kunci tanda tangan
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tugasku.jks"
          echo "TUGASKU_KEYSTORE_PATH=$RUNNER_TEMP/tugasku.jks" >> "$GITHUB_ENV"
      # APK dipecah per jenis prosesor HP (split-per-abi) dan kode Dart
      # diperkecil (obfuscate), agar ukuran file jauh lebih kecil.
      - run: >-
          flutter build apk --release --split-per-abi
          --obfuscate --split-debug-info=build/debug-info
          --build-name=0.1.${{ github.run_number }} --build-number=${{ github.run_number }}
        env:
          TUGASKU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      # hanary.apk: untuk hampir semua HP Android (64-bit, sekitar 2017 ke atas).
      # hanary-hp-lama.apk: untuk HP lama 32-bit jika hanary.apk tidak bisa dipasang.
      - name: Siapkan file APK
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk hanary.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk hanary-hp-lama.apk
          echo "### Ukuran APK" >> "$GITHUB_STEP_SUMMARY"
          ls -l hanary*.apk | awk '{printf "- %s: %.1f MB\n", $9, $5/1048576}' >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Hanary 0.1.${{ github.run_number }}
          body: |
            Download hanary.apk di bawah, lalu install di HP Android.
            Jika muncul pesan "aplikasi tidak kompatibel" (HP lama 32-bit), pakai hanary-hp-lama.apk.
          files: |
            hanary.apk
            hanary-hp-lama.apk
          make_latest: true
