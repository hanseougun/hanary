name: Build APK

# Setiap ada perubahan di branch main, GitHub membuat file APK baru
# dan menaruhnya di halaman Releases untuk di-download ke HP.
# Pull request juga dibangun (untuk memastikan tidak ada yang rusak),
# tetapi hanya main yang diterbitkan ke Releases.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Siapkan kunci tanda tangan
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tugasku.jks"
          echo "TUGASKU_KEYSTORE_PATH=$RUNNER_TEMP/tugasku.jks" >> "$GITHUB_ENV"
      - run: flutter build apk --release
        env:
          TUGASKU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk tugasku.apk
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Tugasku 0.1.${{ github.run_number }}
          body: Download tugasku.apk di bawah, lalu install di HP Android.
          files: tugasku.apk
          make_latest: true
