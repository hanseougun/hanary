name: Server notifikasi

# Memasang server kecil "hanary-notif" (Cloudflare Workers, gratis) yang
# membangunkan HP teman saat ada pesan atau panggilan baru.
# Butuh 3 rahasia di GitHub (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, FIREBASE_SERVICE_ACCOUNT
# Panduan langkahnya ada di README (bagian "Notifikasi instan").
on:
  push:
    branches: [main]
    paths:
      - 'server/notif-worker/**'
      - '.github/workflows/deploy-notif.yml'
  pull_request:
    paths:
      - 'server/notif-worker/**'
      - '.github/workflows/deploy-notif.yml'
  workflow_dispatch:

jobs:
  uji:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test server/notif-worker/test/worker.test.mjs

  pasang:
    needs: uji
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Belum diatur
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Rahasia CLOUDFLARE_API_TOKEN belum ada, server notifikasi tidak dipasang."
      - uses: cloudflare/wrangler-action@v3
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server/notif-worker
          command: deploy
          secrets: |
            FIREBASE_SERVICE_ACCOUNT
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
